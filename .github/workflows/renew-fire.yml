name: 🚀 续一次火

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,2,4 * * *"
      timezone: "Asia/Shanghai"

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_run: ${{ steps.daily-check.outputs.should_run }}
      is_retry: ${{ steps.daily-check.outputs.is_retry }}
      force_failure: ${{ steps.daily-check.outputs.force_failure }}

    steps:
      - name: 检查当天是否已有成功运行 (Check today's successful run)
        id: daily-check
        uses: actions/github-script@v8
        with:
          script: |
            const now = new Date();
            const beijingNow = new Date(now.getTime() + 8 * 60 * 60 * 1000);
            const beijingDate = beijingNow.toISOString().slice(0, 10);
            const dayStart = new Date(`${beijingDate}T00:00:00+08:00`);
            const dayEnd = new Date(dayStart.getTime() + 24 * 60 * 60 * 1000);

            const branch = context.ref.replace('refs/heads/', '');
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'renew-fire.yml',
              branch,
              per_page: 100,
            });

            const previousRunsToday = data.workflow_runs.filter((run) => {
              if (run.id === Number(context.runId)) return false;
              const createdAt = new Date(run.created_at);
              return createdAt >= dayStart && createdAt < dayEnd;
            });
            const hasSuccessfulRun = previousRunsToday.some(
              (run) => run.conclusion === 'success',
            );
            const isRetry = previousRunsToday.length > 0;
            const forceFailure = previousRunsToday.length === 0;
            const shouldRun = !hasSuccessfulRun;

            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('is_retry', isRetry ? 'true' : 'false');
            core.setOutput('force_failure', forceFailure ? 'true' : 'false');
            core.info(
              `event=${context.eventName}, Beijing date ${beijingDate}, branch ${branch}: previous runs=${previousRunsToday.length}, successful=${hasSuccessfulRun}, retry=${isRetry}, forceFailure=${forceFailure}, shouldRun=${shouldRun}`,
            );

  run:
    needs: check
    if: ${{ always() && needs.check.outputs.should_run == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: 模拟续火结果 (Simulate spark result)
        env:
          FORCE_FAILURE: ${{ needs.check.outputs.force_failure }}
        run: |
          if [ "$FORCE_FAILURE" = "true" ]; then
            echo "测试模式：北京时间当天第一次运行，固定失败"
            exit 1
          fi
          echo "测试模式：北京时间当天第二次及以后运行，固定成功"

      - name: 检查邮件配置 (Check mail configuration)
        id: mail-config
        if: ${{ always() }}
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_ADDRESS" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发送补充执行成功邮件 (Send retry success email)
        if: ${{ success() && needs.check.outputs.is_retry == 'true' && steps.mail-config.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_HOST || 'smtp.qq.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: ${{ secrets.MAIL_SECURE || 'true' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 抖音续火补充执行成功
          to: ${{ secrets.MAIL_TO || secrets.MAIL_ADDRESS }}
          from: ${{ secrets.MAIL_ADDRESS }}
          body: |
            抖音续火任务补充执行成功
            仓库：${{ github.repository }}
            运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 发送失败邮件 (Send failure email)
        if: ${{ failure() && steps.mail-config.outputs.enabled == 'true' && needs.check.outputs.is_retry != 'true' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_HOST || 'smtp.qq.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: ${{ secrets.MAIL_SECURE || 'true' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 抖音续火任务失败
          to: ${{ secrets.MAIL_TO || secrets.MAIL_ADDRESS }}
          from: ${{ secrets.MAIL_ADDRESS }}
          body: |
            抖音续火任务执行失败
            仓库：${{ github.repository }}
            运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            如确认配置无误后仍然失败，请在上游仓库发送 issue：
            https://github.com/bling-yshs/douyin-auto-spark/issues

